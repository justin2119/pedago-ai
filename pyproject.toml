[project]
name = "pedago-ai"
version = "0.1.0"
description = "AI-assisted lesson plan generation for Togolese secondary education (APC)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-ai>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "supabase>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "python-docx>=1.1.2",
    "pypdf>=4.2.0",
    "tqdm>=4.66.0",
]

[project.scripts]
pedago-ai-ingest = "pedago_ai.rag.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pedago_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
